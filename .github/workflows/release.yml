name: Release

# Publish installers when a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    env:
      # Tauri's beforeBuildCommand runs `npm run build` (tsc + vite); the
      # Monaco-heavy bundle OOMs Node's default heap on the macOS runner.
      NODE_OPTIONS: --max-old-space-size=4096
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      - name: Build & publish (draft release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Problem Journal ${{ github.ref_name }}"
          releaseBody: |
            Download the installer for your platform below.

            > Windows and macOS builds are **unsigned**, so your OS may warn you
            > about an unknown publisher. See the README for how to proceed.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Publish the release only once every platform's installer has been uploaded,
  # so nobody downloads from a half-finished release.
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Uses release-notes/<tag>.md as the release description when it exists;
      # otherwise the default text set by the build job is kept.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          NOTES="release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            gh release edit "$TAG" --notes-file "$NOTES" --draft=false --latest --repo "$REPO"
          else
            gh release edit "$TAG" --draft=false --latest --repo "$REPO"
          fi
